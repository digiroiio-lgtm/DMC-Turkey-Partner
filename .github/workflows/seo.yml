name: SEO

# The repo has no build step and no tests, so nothing has ever verified that a
# content edit kept the crawl surface intact. These two checks are read-only
# and take seconds.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/sitemaps.py reads <lastmod> from each file's last commit
          # date, so a shallow clone would report every page as uncommitted.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # tools/sitemaps.py uses glob(root_dir=...), added in 3.10.
          python-version: '3.11'

      - name: Generated output is committed and converged
        # The generators are idempotent, so a clean checkout plus one build
        # must produce exactly what is committed. This catches both a
        # forgotten re-run and a patcher that never settles — an earlier
        # version of the fence logic left its indentation behind on every
        # strip and walked the following line further right each run, which a
        # filename-level check does not see.
        run: |
          python3 tools/cop31_build.py > /dev/null
          if ! git diff --quiet; then
            echo "Build output differs from the committed tree:"
            git diff --stat
            exit 1
          fi

      - name: Sitemap coverage
        run: python3 tools/sitemaps.py --check

      - name: SEO audit
        # --max-warnings is a ratchet, not a threshold. It is seeded at the
        # count on the day the check landed and lowered as content work lands,
        # so the number can fall but never grow. Errors always fail.
        run: python3 tools/seo_check.py --max-warnings 191
